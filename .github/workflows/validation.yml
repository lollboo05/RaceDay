name: Validate RaceDay Repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -d docs
          test -f docs/API_Endpoint_Plan.md
          test -f README.md
          echo "Required RaceDay files are present."
